[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "softcas-impl"
version = "0.1.0"
description = "Evidence-traceable SoftCAS execution reference"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11", "Pillow>=10", "psutil>=5.9"]

[project.optional-dependencies]
yolo = ["ultralytics==8.4.0"]
export = ["onnx>=1.16,<2", "onnxscript>=0.1,<1"]

[tool.setuptools.packages.find]
include = ["softcas*"]
